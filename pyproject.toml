[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[project]
name = "ulp-wearable-module-tools"
version = "0.0.0"
description = "Engineering helper scripts for the ULP Wearable Module hardware project."
requires-python = ">=3.11"
